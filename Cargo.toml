[package]
name = "rcpr"
version = "0.5.0"
authors = ["Jon Drobny <jdrobny@tae.com>"]
edition = "2024"
description = "Adaptive Chebyshev Proxy Rootfinding with Automatic Subdivision and auxiliary functions."
license = "GPL-3.0-only"
repository = "https://github.com/drobnyjt/rcpr"
rust-version = "1.85"
keywords = ["rootfinding", "chebyshev"]
categories = ["mathematics", "science", "physics"]

[dependencies]
# This includes the pull request that fixes nalgebra issue #611. Will use a version when released.
nalgebra = { git = "https://github.com/dimforge/nalgebra", rev = "0ecccbfece2bd72f163e82842c4b592b54d6a862" }
pyo3 = {version="0.29.2", optional=true}
thiserror = "2"
serde = {version="1.0.229", features=["derive"]}
pythonize = {version="0.29.0", optional=true}
cached = "3.1.1"

[profile.release]
debug = "line-tables-only"
opt-level = 3
lto = "fat"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
python = ["pyo3", "pythonize"]