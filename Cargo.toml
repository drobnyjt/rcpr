[package]
name = "rcpr"
version = "0.2.0"
authors = ["Jarat <jdrobny@tae.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
nalgebra = "0.35.0"
cached = {version="2.0.2"}
pyo3 = {version="0.29.2", optional=true}
anyhow = "1.0.104"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
python = ["pyo3"]