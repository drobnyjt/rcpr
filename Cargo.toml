[package]
name = "rcpr"
version = "0.4.0"
authors = ["Jon Drobny <jdrobny@tae.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# This includes the pull request that fixes #611
nalgebra = { git = "https://github.com/dimforge/nalgebra", rev = "0ecccbfece2bd72f163e82842c4b592b54d6a862" }
pyo3 = {version="0.29.2", optional=true}
thiserror = "2"
serde = {version="1.0.229", features=["derive"]}
pythonize = {version="0.29.0", optional=true}
cached = "3.1.1"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
python = ["pyo3", "pythonize"]
